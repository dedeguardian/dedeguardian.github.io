<!DOCTYPE html>
<html lang="tr" data-title="prof_title">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0612">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARKAT">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARKAT — Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0612;--panel:#150c26;--line:#3a2a5c;--ink:#f5f0ff;--dim:#9c8fc4;
    --cyan:#00fff2;--magenta:#ff2a6d;--amber:#ffb000}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323','DotGothic16',monospace;font-size:20px;line-height:1.35}
  h1,h2,.btn{font-family:'Press Start 2P','DotGothic16',system-ui;line-height:1.6}
  .crt{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 4px);mix-blend-mode:multiply}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.75)}
  .backdrop{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(60vw 40vh at 15% -10%, rgba(47,139,255,.14), transparent 60%),
    radial-gradient(55vw 40vh at 95% 10%, rgba(255,42,109,.12), transparent 60%), var(--bg)}
  main{max-width:640px;margin:0 auto;padding:36px 22px 70px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
  a.back{color:var(--dim);text-decoration:none;font-size:13px}
  a.back:hover{color:var(--ink)}
  h1{font-size:clamp(20px,5vw,30px);margin:0 0 28px;text-shadow:-2px 0 var(--magenta),2px 0 var(--cyan)}
  h2.section{font-size:12px;color:var(--amber);margin:34px 0 18px;border-bottom:3px solid var(--line);padding-bottom:12px}
  .card{background:var(--panel);border:3px solid var(--line);padding:18px;display:flex;gap:18px;align-items:center}
  .pic{width:84px;height:84px;border:3px solid var(--amber);object-fit:cover;background:var(--line);flex:0 0 auto;box-shadow:0 0 14px #ffb00066}
  .info{min-width:0}
  .name{font-family:'Press Start 2P','DotGothic16';font-size:14px;margin:0 0 12px;word-break:break-word;line-height:1.5}
  .info p{margin:0 0 4px;color:var(--dim);font-size:18px;word-break:break-all}
  .info b{color:var(--cyan);font-weight:400}
  .row{display:flex;justify-content:space-between;background:var(--panel);border:3px solid var(--line);padding:12px 16px;margin-bottom:10px}
  .row span{color:var(--dim)} .row b{color:var(--ink);font-weight:400;font-size:24px}

  .hint{color:var(--dim);font-size:18px;margin:-6px 0 16px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .badge{background:var(--panel);border:3px solid var(--amber);padding:14px 10px;text-align:center;box-shadow:0 0 14px #ffb00033}
  .badge svg{width:84px;height:84px}
  .badge .bn{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:10px;line-height:1.6;margin-top:8px;color:var(--amber)}
  .badge .bd{color:var(--dim);font-size:17px;line-height:1.25;margin-top:6px}
  .badge.lock{border:3px dashed var(--line);box-shadow:none}
  .badge.lock .bn{color:var(--dim)}
  .badge.lock svg{opacity:.6}
  .gcard{background:var(--panel);border:3px solid var(--line);margin-bottom:18px;box-shadow:6px 6px 0 rgba(0,0,0,.55)}
  .ghead{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:3px solid var(--line)}
  .gicon{width:56px;height:56px;border:3px solid var(--cyan);flex:0 0 auto;background:#0d0818;overflow:hidden}
  .gicon svg{display:block;width:100%;height:100%}
  .gname{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:12px;line-height:1.6}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:2px solid #24173f;color:var(--ink);font:inherit;font-size:21px;text-align:left;padding:11px 14px;cursor:pointer}
  .srow:first-of-type{border-top:0}
  button.srow:hover{background:#1d1136}
  button.srow:hover .go{color:var(--cyan)}
  .srow .sl{color:var(--dim)}
  .srow .sv{display:flex;align-items:center;gap:12px}
  .srow .sv b{font-weight:400;font-size:26px}
  .srow .rk{display:flex;flex-direction:column;align-items:flex-end;min-width:66px;font-style:normal;line-height:1.1}
  .srow .rk small{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:8px;color:var(--dim)}
  .srow .rk span{font-family:'Press Start 2P',system-ui;font-size:13px;color:var(--amber);margin-top:5px}
  .srow .go{color:var(--dim);font-size:22px}


  .pcard{background:var(--panel);border:3px solid var(--line);padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .pinfo{min-width:0;flex:1}
  .pname{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:14px;line-height:1.5;margin:0 0 4px;word-break:break-all}
  .psub{color:var(--dim);font-size:19px;margin:0 0 6px}
  .pinfo p{margin:0 0 3px;color:var(--dim);font-size:18px;word-break:break-all}
  .pinfo b{color:var(--cyan);font-weight:400}
  .row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .panel{background:var(--panel);border:3px solid var(--amber);padding:18px;margin-top:16px}
  .panel[hidden]{display:none}
  .panel h3{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:10px;color:var(--amber);margin:18px 0 10px;line-height:1.6}
  .panel h3:first-child{margin-top:0}
  .prow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:12px}
  .presets button{padding:0;border:3px solid var(--line);background:#0d0818;cursor:pointer;aspect-ratio:1;overflow:hidden}
  .presets button:hover{border-color:var(--cyan)}
  .presets svg,.presets img{display:block;width:100%;height:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fld{width:100%;background:#0a0612;color:var(--ink);border:3px solid var(--line);padding:10px 12px;font:22px 'VT323','DotGothic16',monospace;outline:none}
  .fld:focus{border-color:var(--cyan)}
  .fl{display:block;color:var(--dim);font-size:17px;margin:0 0 4px}
  .note{color:var(--dim);font-size:17px;margin:8px 0 10px;line-height:1.25}
  .fr{display:flex;align-items:center;gap:12px;background:var(--panel);border:3px solid var(--line);padding:10px 12px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
  .fr:hover{border-color:var(--cyan)}
  .fr .fn{flex:1;min-width:0;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr .fn small{display:block;color:var(--dim);font-size:16px;line-height:1}
  .fr .fa{display:flex;gap:8px}
  .sub{font-family:'Press Start 2P','DotGothic16',system-ui;font-size:10px;color:var(--dim);margin:16px 0 10px}

  .msg{color:var(--dim);background:var(--panel);border:3px dashed var(--line);padding:22px;text-align:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);color:var(--ink);
    border:3px solid var(--cyan);padding:14px 22px;font-size:12px;box-shadow:5px 5px 0 var(--magenta);cursor:pointer;margin-top:18px}
  .btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--magenta)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="backdrop"></div><div class="vignette"></div><div class="crt"></div>

<main>
  <div class="top">
    <a class="back" href="index.html" data-i18n="back_home">◂ ANA SAYFA</a>
    <div id="arkat-bar"></div>
  </div>
  <h1 data-i18n="prof_h">PROFİL</h1>

  <div id="loading" class="msg" data-i18n="loading">YÜKLENİYOR…</div>

  <div id="guest" class="msg" hidden>
    <p data-i18n="prof_need" style="margin:0">Profilini görmek için Google ile giriş yap.</p>
    <button class="btn" id="gbtn"><span data-i18n="login">GİRİŞ YAP</span></button>
  </div>

  <div id="me" hidden>
    <div class="pcard">
      <span id="pic"></span>
      <div class="pinfo">
        <div class="pname"><span id="uname"></span><span id="atag" class="atag" hidden></span></div>
        <p class="psub" id="ufull"></p>
        <p><b data-i18n="f_email">E-POSTA</b> · <span id="umail"></span></p>
        <p><b data-i18n="f_joined">KATILIM</b> · <span id="ujoin">—</span></p>
        <div class="row2"><button class="abtn sm" id="setbtn" type="button">⚙ <span data-i18n="settings_h">AYARLAR</span></button></div>
      </div>
    </div>

    <div class="panel" id="settings" hidden>
      <h3 data-i18n="set_photo">PROFİL RESMİ</h3>
      <div class="prow">
        <span id="spic"></span>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="abtn sm" id="upbtn" type="button"><span data-i18n="set_upload">FOTOĞRAF YÜKLE</span></button>
          <button class="abtn sm ghost" id="gpbtn" type="button"><span data-i18n="set_google">GOOGLE FOTOĞRAFIM</span></button>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <p class="note" data-i18n="set_presets" style="margin-top:14px">YA DA BİR AVATAR SEÇ</p>
      <div class="presets" id="presets"></div>

      <h3 data-i18n="set_username">KULLANICI ADI</h3>
      <input class="fld" id="uninp" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="unst" id="unst"></div>
      <button class="abtn sm" id="unbtn" type="button" disabled><span data-i18n="set_save">KAYDET</span></button>

      <h3 data-i18n="set_name">İSİM (İSTEĞE BAĞLI)</h3>
      <div class="two">
        <div><label class="fl" data-i18n="set_first">Ad</label><input class="fld" id="fn" type="text" maxlength="24" autocomplete="off"></div>
        <div><label class="fl" data-i18n="set_last">Soyad</label><input class="fld" id="ln" type="text" maxlength="24" autocomplete="off"></div>
      </div>
      <p class="note" data-i18n="set_hint_name"></p>
      <button class="abtn sm" id="nmbtn" type="button"><span data-i18n="set_save">KAYDET</span></button>
    </div>

    <h2 class="section" id="h-friends"><span data-i18n="friends_h">ARKADAŞLAR</span></h2>
    <div id="s-friends">
      <div id="reqbox" hidden><div class="sub" data-i18n="fr_requests">GELEN İSTEKLER</div><div id="reqs"></div></div>
      <div id="friends"></div>
      <button class="more" id="frmore" type="button" hidden></button>
    </div>

    <h2 class="section" id="h-favs"><span data-i18n="favs_h">FAVORİ OYUNLAR</span></h2>
    <div id="s-favs"><div id="favs"></div></div>

    <h2 class="section" id="h-badges"><span data-i18n="badges_h">ROZETLER</span></h2>
    <div id="s-badges"><div id="badges" class="badges"></div><a class="more" id="bdmore" href="badges.html"></a></div>

    <h2 class="section" id="h-scores"><span data-i18n="scores_h">SKORLARIM</span></h2>
    <div id="s-scores"><p class="hint" data-i18n="tap_rank">Sıralamayı görmek için bir skora dokun.</p>
    <div id="gcards"></div></div>
  </div>
</main>

<script src="arkat.js" data-root=""></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var A=ARKAT, el=A.el;

  function fmt(ts){
    if(!ts||!ts.toDate) return '—';
    var l=A.getLang(); var loc=l==='ja'?'ja-JP':(l==='en'?'en-GB':'tr-TR');
    return ts.toDate().toLocaleDateString(loc,{year:'numeric',month:'long',day:'numeric'});
  }
  function setAvatar(box,photo,size){
    box.innerHTML=''; box.appendChild(A.avatar(photo,size,'big'));
  }

  // ---- üst kart ----
  function renderTop(u,p){
    p=p||{};
    setAvatar($('pic'),p.photo||u.photoURL,84);
    setAvatar($('spic'),p.photo||u.photoURL,72);
    $('uname').textContent=p.username?('@'+p.username):A.shownName(p);
    $('atag').textContent=A.t('admin_tag');$('atag').hidden=!A.isAdminUid(u.uid);
    var full=((p.firstName||'')+' '+(p.lastName||'')).trim();
    $('ufull').textContent=full;
    $('umail').textContent=u.email||'';
    $('ujoin').textContent=fmt(p.createdAt);
    if(document.activeElement!==$('uninp')) $('uninp').value=p.username||'';
    if(document.activeElement!==$('fn')) $('fn').value=p.firstName||'';
    if(document.activeElement!==$('ln')) $('ln').value=p.lastName||'';
  }

  // ---- ayarlar ----
  var uninpSay=null;
  function initSettings(){
    $('setbtn').addEventListener('click',function(){var s=$('settings');s.hidden=!s.hidden});
    // fotoğraf yükle
    $('upbtn').addEventListener('click',function(){$('file').click()});
    $('file').addEventListener('change',function(){
      var f=this.files&&this.files[0]; this.value='';
      if(!f) return;
      A.fileToAvatar(f).then(function(url){return A.setPhoto(url,'custom')})
        .then(function(){A.toast(A.t('set_saved'))})
        .catch(function(){A.toast(A.t('set_photo_err'))});
    });
    $('gpbtn').addEventListener('click',function(){
      var u=A.getUser(); if(!u||!u.photoURL) return;
      A.setPhoto(u.photoURL,'google').then(function(){A.toast(A.t('set_saved'))}).catch(function(){A.toast(A.t('set_err'))});
    });
    // hazır avatarlar
    var pr=$('presets');
    A.PRESETS.forEach(function(svg){
      var b=el('button'); b.type='button';
      var im=document.createElement('img'); im.alt=''; im.src=A.svgDataUrl(svg); b.appendChild(im);
      b.addEventListener('click',function(){
        A.setPhoto(A.svgDataUrl(svg),'custom').then(function(){A.toast(A.t('set_saved'))}).catch(function(){A.toast(A.t('set_err'))});
      });
      pr.appendChild(b);
    });
    // kullanıcı adı
    uninpSay=A.bindUsernameField($('uninp'),$('unst'),$('unbtn'));
    $('unbtn').addEventListener('click',function(){A.submitUsername($('uninp'),$('unst'),$('unbtn'))});
    // isim
    $('nmbtn').addEventListener('click',function(){
      A.updateNames($('fn').value,$('ln').value).then(function(){A.toast(A.t('set_saved'))}).catch(function(){A.toast(A.t('set_err'))});
    });
  }

  // ---- arkadaşlar ----
  function friendRow(p,uid,actions){
    var a=el('a','fr'); a.href=A.userLink(uid,p&&p.username);
    a.appendChild(A.avatar(p&&p.photo,40));
    var nm=el('span','fn','@'+((p&&p.username)||'?'));
    var sub=A.publicName(p); if(sub) nm.appendChild(el('small',null,sub));
    a.appendChild(nm);
    if(actions){
      var box=el('span','fa');
      actions.forEach(function(x){
        var b=el('button','abtn sm '+(x.cls||''),A.t(x.key)); b.type='button';
        b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();b.disabled=true;x.fn()});
        box.appendChild(b);
      });
      a.appendChild(box);
    }
    return a;
  }
  var frExpanded=false;
  function renderFriends(){
    var list=A.getFriendList(), reqs=$('reqs'), fr=$('friends'), more=$('frmore');
    reqs.innerHTML=''; fr.innerHTML=''; more.hidden=true;
    var me=A.getUser().uid;
    var inc=list.filter(function(f){return f.status==='pending'&&f.from!==me});
    var acc=list.filter(function(f){return f.status==='accepted'});
    var out=list.filter(function(f){return f.status==='pending'&&f.from===me});
    $('reqbox').hidden=!inc.length;
    function reload(){A.loadFriendships(true).then(renderFriends)}
    function fail(){A.toast(A.t('set_err'))}
    inc.forEach(function(f){
      A.getProfileById(f.other).then(function(p){
        reqs.appendChild(friendRow(p,f.other,[
          {key:'fr_accept',fn:function(){A.acceptFriend(f.other).then(reload).catch(fail)}},
          {key:'fr_decline',cls:'ghost',fn:function(){A.removeFriend(f.other).then(reload).catch(fail)}}
        ]));
      });
    });
    if(!acc.length&&!out.length){fr.appendChild(el('div','msg',A.t('fr_none')));return}
    var all=acc.map(function(f){return {f:f,acts:null}}).concat(out.map(function(f){return {f:f,acts:[{key:'fr_cancel',cls:'ghost',fn:function(){A.removeFriend(f.other).then(reload).catch(fail)}}]}}));
    Promise.all(all.map(function(x){return A.getProfileById(x.f.other)})).then(function(ps){
      fr.innerHTML='';
      var LIM=4;
      all.forEach(function(x,i){
        var row=friendRow(ps[i],x.f.other,x.acts);
        if(!frExpanded&&i>=LIM)row.hidden=true;
        fr.appendChild(row);
      });
      if(all.length>LIM){
        more.hidden=false;
        more.textContent=frExpanded?A.t('show_less'):A.t('see_all')+' ('+all.length+')';
        more.onclick=function(){frExpanded=!frExpanded;renderFriends()};
      }
    });
  }

  // ---- ana akış ----
  var wired=false;
  function render(){
    var u=A.getUser();
    $('loading').hidden=true;
    if(!u){ $('me').hidden=true; $('guest').hidden=false; return; }
    $('guest').hidden=true; $('me').hidden=false;
    var p=A.getProfile()||{};
    if(!wired){wired=true;initSettings()}
    renderTop(u,p);
    var data=Object.assign({},p,{badges:Object.assign({},A.localBadges(),p.badges||{})});
    var bi=A.renderBadges($('badges'),data,{limit:4,href:'badges.html'});
    $('bdmore').textContent=A.t('see_all')+' ('+bi.earned+' / '+bi.total+')';
    A.renderFavs($('favs'),A.getFavs(),true);
    A.renderScoreCards($('gcards'),data,u.uid);
    A.syncBoards(p.best).then(function(){A.renderScoreCards($('gcards'),data,u.uid)}).catch(function(){});
    A.loadFriendships(false).then(renderFriends);
  }
  [['friends','h-friends','s-friends',true],['favs','h-favs','s-favs',true],['badges','h-badges','s-badges',true],['scores','h-scores','s-scores',true]].forEach(function(x){A.collapsible($(x[1]),$(x[2]),x[0],x[3])});
  document.addEventListener('arkat:favs',function(){ if(A.getUser()) A.renderFavs($('favs'),A.getFavs(),true) });
  $('gbtn').addEventListener('click',function(){A.signIn()});
  document.addEventListener('arkat:auth',function(){render()});
  document.addEventListener('arkat:profile',function(){ if(A.getUser()&&!$('me').hidden){var u=A.getUser();renderTop(u,A.getProfile())} });
  document.addEventListener('arkat:lang',function(){ if(A.getUser()&&!$('me').hidden) render() });
  if(!A.isConfigured()){ $('loading').hidden=true; $('guest').hidden=false; }
})();
</script>
</body>
</html>
