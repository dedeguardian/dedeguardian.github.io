<script>
(()=>{
'use strict';
/* ============== sabitler ============== */
const W=360,H=700,CS=6,C=56,R=64,N=C*R,FL=12,FT=72;
const cv=document.getElementById('cv'),x=cv.getContext('2d'),ov=document.getElementById('ov'),wrap=document.getElementById('w');
const touchy=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

/* ============== diller (TR / EN / JA) ============== */
const T={
tr:{level:'SEVİYE MODU',endless:'SONSUZ MOD',scores:'YÜKSEK SKORLAR',how:'NASIL OYNANIR',sndOn:'SES: AÇIK',sndOff:'SES: KAPALI',exit:'ÇIKIŞ',pick:'SEVİYE SEÇ',back:'◂ GERİ',paused:'DURAKLATILDI',resume:'DEVAM ET',restart:'SEVİYEYİ YENİLE',pad:'TUŞ KONUMU',padL:'SOL',padC:'ORTA',padR:'SAĞ',menu:'ANA MENÜ',over:'OYUN BİTTİ',score:'SKOR',best:'EN İYİ',newBest:'YENİ REKOR!',retry:'TEKRAR DENE',clear:'SEVİYE TAMAM!',next:'SONRAKİ SEVİYE',area:'ALAN',bonus:'BONUS',win:'TÜM SEVİYELER TAMAM!',winSub:'Bölgenin efendisi sensin.',lvl:'SEVİYE',boss:'BOSS',hint:'KENARDAN İÇERİ ÇİZ · ÇİZGİYİ DUVARA BAĞLA',mL:'SEVİYE',mE:'SONSUZ',none:'—',
 how1:'Duvardan boşluğa doğru ilerleyip çizgi çiz, çizgiyi başka bir duvara bağlayarak alanı kapat.',

en:{level:'LEVEL MODE',endless:'ENDLESS MODE',scores:'HIGH SCORES',how:'HOW TO PLAY',sndOn:'SOUND: ON',sndOff:'SOUND: OFF',exit:'EXIT',pick:'SELECT LEVEL',back:'◂ BACK',paused:'PAUSED',resume:'RESUME',restart:'RESTART LEVEL',pad:'BUTTON POSITION',padL:'LEFT',padC:'CENTER',padR:'RIGHT',menu:'MAIN MENU',over:'GAME OVER',score:'SCORE',best:'BEST',newBest:'NEW RECORD!',retry:'TRY AGAIN',clear:'LEVEL CLEAR!',next:'NEXT LEVEL',area:'AREA',bonus:'BONUS',win:'ALL LEVELS CLEARED!',winSub:'You rule the zone.',lvl:'LEVEL',boss:'BOSS',hint:'DRAW FROM THE EDGE · CONNECT TO A WALL',mL:'LEVEL',mE:'ENDLESS',none:'—',

ja:{level:'レベルモード',endless:'エンドレスモード',scores:'ハイスコア',how:'遊び方',sndOn:'サウンド：オン',sndOff:'サウンド：オフ',exit:'終了',pick:'レベル選択',back:'◂ 戻る',paused:'一時停止',resume:'再開',restart:'やり直す',pad:'ボタンの位置',padL:'左',padC:'中央',padR:'右',menu:'メインメニュー',over:'ゲームオーバー',score:'スコア',best:'ベスト',newBest:'新記録！',retry:'もう一度',clear:'レベルクリア！',next:'次のレベル',area:'占領率',bonus:'ボーナス',win:'全レベルクリア！',winSub:'あなたがゾーンの支配者だ。',lvl:'レベル',boss:'ボス',hint:'フチから線を引いて、壁につなごう',mL:'レベル',mE:'エンドレス',none:'—',
 how1:'壁から空きスペースへ線を引き、別の壁につなげてエリアを囲もう。',
 how2:'小さい側があなたの領域になる。囲んだ側に閉じ込めたクリーチャーは消滅する。',
 how3:'線が完成する前にクリーチャーが触れるとライフを失う。壁の上ならクリーチャーは安全だが、壁を走るスパークに注意！',
 how4:'目標の占領率に到達するか、全クリーチャーを倒そう。5レベルごとにボスが登場。'}
};
let lang='en';
try{
  const nl=localStorage.getItem('nc_lang');if(nl&&T[nl])lang=nl;else{const b=(navigator.language||'en').slice(0,2);if(T[b])lang=b}
  const sl=localStorage.getItem('arkat-lang'),seen=localStorage.getItem('nc_sitelang');
  if(sl&&T[sl]&&sl!==seen){lang=sl;localStorage.setItem('nc_lang',sl);localStorage.setItem('nc_sitelang',sl)}
}catch(e){}
const t=k=>(T[lang]&&T[lang][k]!=null)?T[lang][k]:T.en[k];

/* ============== kayıtlar ============== */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=ls.get('nc_done',[]);while(done.length<20)done.push(false);
let hs=[ls.get('nc_hs_0',[]),ls.get('nc_hs_1',[])];
let mute=ls.get('nc_mute',false),padPos=ls.get('nc_pad',1);

/* ============== seviye tablosu ============== */
// b: zıplayan, w: titrek, h: avcı, s: kıvılcım (duvarda gezer), X: boss  → [adet, hız (hücre/sn)]
const LAY=[
 [],
 [[24,28,8,8]],
 [[14,20,6,6],[36,36,6,6]],
 [[14,30,28,3]],
 [[26,18,4,28],[16,30,24,4]],
 [[10,10,6,6],[40,10,6,6],[10,48,6,6],[40,48,6,6]],
 [[12,14,8,4],[20,26,8,4],[28,38,8,4],[36,50,8,4]],
 [[16,18,10,2],[30,18,10,2],[16,44,10,2],[30,44,10,2],[16,18,2,10],[16,34,2,12],[38,18,2,10],[38,34,2,12]],
 [[8,16,26,2],[22,32,26,2],[8,48,26,2]]
];
const LV=[
 {tgt:55,b:[1,10],o:0},
 {tgt:60,b:[2,11],o:0},
 {tgt:60,b:[2,12],s:[1,12],o:0},
 {tgt:62,b:[3,12],s:[1,12],o:1},
 {tgt:90,X:[1,9],b:[1,11],o:2},
 {tgt:62,w:[2,13],b:[1,12],s:[1,13],o:0},
 {tgt:64,b:[3,14],w:[1,13],s:[2,13],o:3},
 {tgt:64,h:[1,8],b:[2,13],s:[1,14],o:0},
 {tgt:66,w:[3,14],s:[2,14],o:4},
 {tgt:90,X:[1,10],w:[2,13],h:[1,8],s:[2,14],o:5},
 {tgt:66,b:[4,15],h:[1,9],s:[2,15],o:6},
 {tgt:68,w:[4,15],h:[2,9],s:[2,15],o:0},
 {tgt:68,b:[3,15],w:[2,15],h:[2,9],s:[3,15],o:7},
 {tgt:70,w:[3,16],h:[2,10],s:[3,16],o:3},
 {tgt:90,X:[1,11],h:[2,10],s:[3,16],o:8},
 {tgt:70,b:[4,17],w:[3,16],h:[2,10],s:[3,17],o:2},
 {tgt:72,w:[5,17],h:[3,10],s:[3,17],o:4},
 {tgt:72,b:[4,18],w:[3,17],h:[3,11],s:[4,17],o:6},
 {tgt:74,w:[4,18],h:[4,11],s:[4,18],o:5},
 {tgt:92,X:[1,12],w:[3,17],h:[3,11],s:[4,18],o:7}
];
function endlessSpec(n){
  const sp=Math.min(19,10+n*.8),f=Math.max(0,Math.floor((n-2)/4));
  const o={tgt:Math.min(78,58+n*1.2),b:[Math.min(5,1+(n>>1)),sp],o:n%9};
  const w=Math.min(5,Math.floor((n-1)/3)),s=Math.min(4,Math.floor(n/3));
  if(w)o.w=[w,sp+1];if(f)o.h=[Math.min(4,f),Math.min(11,8+n*.2)];if(s)o.s=[s,sp+1];
  if(n%5===0){o.X=[1,Math.min(13,9+n/5*.8)];o.tgt=90}
  return o;
}
const hueOf=n=>(190+(n-1)*23)%360;

/* ============== durum ============== */
let mode=0,lvl=1,spec=null,lives=3,score=0,S='menu',ovName='';
const g=new Uint8Array(N),comp=new Int16Array(N);
let P=1,claimed=0,px=C>>1,py=R-1,dir=null,drawing=false,trail=[],startCell=[C>>1,R-1],stepAcc=0;
let enemies=[],sparks=[],parts=[],flash=null;
let invuln=0,grace=0,dyingT=0,shake=0,gt=0,hintT=0,clearBonus=0,winT=0;
let bgDirty=true,clDirty=true,S0=1,bgCv=document.createElement('canvas'),clCv=document.createElement('canvas');
const held=[];
const ptrs={};

/* ============== ses ============== */
let ac=null;
function beep(f,d,ty,v,f2){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g2=ac.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g2.gain.setValueAtTime(v||.06,ac.currentTime);g2.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g2);g2.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sfx={claim:n=>{beep(380,.12,'square',.05,760);if(n>60)beep(760,.12,'triangle',.04,1100)},kill:()=>{beep(220,.25,'sawtooth',.07,60);beep(900,.15,'square',.04,1500)},die:()=>beep(400,.6,'sawtooth',.08,40),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.06),i*110))},tick:()=>beep(1200,.03,'square',.02)};

/* ============== yardımcılar ============== */
const idx=(a,b)=>b*C+a;
const inb=(a,b)=>a>=0&&b>=0&&a<C&&b<R;
const cx2=a=>FL+a*CS, cy2=b=>FT+b*CS;
function glow(c,b){x.shadowColor=c;x.shadowBlur=b}
function txt(s,a,b,sz,col,al,font){x.font=(font||"'Press Start 2P','DotGothic16',monospace").replace(/^/,sz+'px ');x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='middle';x.fillText(s,a,b)}
function pct(){return Math.min(100,claimed*100/P)}

/* ============== seviye kurulumu ============== */
function initLevel(sp,demo){
  spec=sp;g.fill(0);
  for(let a=0;a<C;a++){g[idx(a,0)]=1;g[idx(a,R-1)]=1}
  for(let b=0;b<R;b++){g[idx(0,b)]=1;g[idx(C-1,b)]=1}
  for(const r of LAY[sp.o||0])for(let b=r[1];b<r[1]+r[3];b++)for(let a=r[0];a<r[0]+r[2];a++)g[idx(a,b)]=1;
  P=0;for(let i=0;i<N;i++)if(g[i]===0)P++;
  claimed=0;px=C>>1;py=R-1;dir=null;drawing=false;trail=[];startCell=[px,py];stepAcc=0;
  parts=[];flash=null;invuln=0;grace=demo?0:1.4;dyingT=0;shake=0;
  enemies=[];sparks=[];
  const R_={b:1.1,w:1.1,h:1.3,X:2.6};
  const add=(ty,cnt,spd)=>{for(let k=0;k<cnt;k++){
    let ex,ey,n=0;do{ex=3+Math.random()*(C-6);ey=3+Math.random()*(R-6);n++}while((g[idx(ex|0,ey|0)]!==0||Math.hypot(ex-px,ey-py)<(demo?0:16))&&n<300);
    let a=Math.random()*6.2832;if(Math.abs(Math.sin(a*2))<.25)a+=.4;
    enemies.push({t:ty,x:ex,y:ey,dx:Math.cos(a),dy:Math.sin(a),sp:spd,r:R_[ty],tm:Math.random()*2,dead:false,ph:Math.random()*6})}};
  if(sp.X)add('X',sp.X[0],sp.X[1]);
  if(sp.b)add('b',sp.b[0],sp.b[1]);
  if(sp.w)add('w',sp.w[0],sp.w[1]);
  if(sp.h)add('h',sp.h[0],sp.h[1]);
  if(sp.s)spawnSparks(sp.s[0],sp.s[1]);
  clDirty=true;
}
function isB(a,b){
  if(!inb(a,b)||g[idx(a,b)]!==1)return false;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;const na=a+i,nb=b+j;if(inb(na,nb)&&g[idx(na,nb)]===0)return true}
  return false;
}
function spawnSparks(cnt,spd){
  const cells=[];for(let b=0;b<R;b++)for(let a=0;a<C;a++)if(isB(a,b)&&Math.hypot(a-px,b-py)>22)cells.push([a,b]);
  for(let k=0;k<cnt&&cells.length;k++){const c=cells.splice((Math.random()*cells.length)|0,1)[0];
    const ds=[[1,0],[-1,0],[0,1],[0,-1]];let d=ds[(Math.random()*4)|0];
    for(const e of ds)if(isB(c[0]+e[0],c[1]+e[1])){d=e;break}
    sparks.push({x:c[0],y:c[1],dx:d[0],dy:d[1],sp:spd,acc:0,dead:false})}
}

/* ============== oyuncu hareketi ============== */
function wantDir(){return held.length?held[held.length-1].d:null}
function press(id,d){for(let i=held.length-1;i>=0;i--)if(held[i].id===id)held.splice(i,1);held.push({id,d})}
function release(id){for(let i=held.length-1;i>=0;i--)if(held[i].id===id)held.splice(i,1)}
function stepPlayer(){
  const d=wantDir();
  if(drawing){if(d&&!(d[0]===-dir[0]&&d[1]===-dir[1]))dir=d}
  else{if(!d){stepAcc=Math.min(stepAcc,1);return}dir=d}
  const nx=px+dir[0],ny=py+dir[1];
  if(!inb(nx,ny)){if(!drawing)dir=null;return}
  const v=g[idx(nx,ny)];
  if(v===2){die();return}
  if(v===1){px=nx;py=ny;if(drawing)closeTrail();return}
  if(!drawing){drawing=true;startCell=[px,py];trail=[]}
  px=nx;py=ny;g[idx(nx,ny)]=2;trail.push(idx(nx,ny));
}
function playerUpdate(dt){
  stepAcc+=dt*(drawing?26:34);let n=0;
  while(stepAcc>=1&&n<4){stepAcc-=1;n++;stepPlayer();if(S!=='play')break}
  if(stepAcc>4)stepAcc=4;
}

/* ============== alan kapatma ============== */
function closeTrail(){
  drawing=false;dir=null;
  const tr=trail;trail=[];
  for(const i of tr)g[i]=1;
  comp.fill(-1);const sizes=[];let id=0;const stack=[];
  for(let i=0;i<N;i++){
    if(g[i]!==0||comp[i]>=0)continue;
    let cnt=0;stack.length=0;stack.push(i);comp[i]=id;
    while(stack.length){const j=stack.pop();cnt++;const a=j%C;
      if(a>0&&g[j-1]===0&&comp[j-1]<0){comp[j-1]=id;stack.push(j-1)}
      if(a<C-1&&g[j+1]===0&&comp[j+1]<0){comp[j+1]=id;stack.push(j+1)}
      if(j>=C&&g[j-C]===0&&comp[j-C]<0){comp[j-C]=id;stack.push(j-C)}
      if(j<N-C&&g[j+C]===0&&comp[j+C]<0){comp[j+C]=id;stack.push(j+C)}}
    sizes.push(cnt);id++;
  }
  const newly=[];
  if(sizes.length){
    let keep=0;for(let k=1;k<sizes.length;k++)if(sizes[k]>sizes[keep])keep=k;
    for(let i=0;i<N;i++)if(g[i]===0&&comp[i]!==keep){g[i]=1;newly.push(i)}
  }
  let kills=0;
  for(const e of enemies){if(e.dead)continue;if(g[idx(e.x|0,e.y|0)]===1){e.dead=true;kills++;boom(cx2(e.x),cy2(e.y),e.t==='X'?'#ffd23f':'#ff2bd6',e.t==='X'?60:22)}}
  const gain=tr.length+newly.length;claimed+=gain;
  score+=gain*3+(kills?kills*300*kills:0);
  flash={cells:tr.concat(newly),t:.55};clDirty=true;
  if(kills){sfx.kill();shake=.25}sfx.claim(gain);
  checkWin();
}
function boom(a,b,col,n){for(let i=0;i<n;i++){const an=Math.random()*6.283,sp=30+Math.random()*120;parts.push({x:a,y:b,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:.5+Math.random()*.5,c:col})}}

function die(){

/* ============== düşman güncelleme ============== */
function solidAt(a,b){return !inb(a|0,b|0)||g[idx(a|0,b|0)]===1}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    e.tm-=dt;e.ph+=dt;
    let sp=e.sp;
    if(e.t==='w'&&e.tm<=0){e.tm=.5+Math.random()*.8;const a=Math.atan2(e.dy,e.dx)+(Math.random()-.5)*1.0;e.dx=Math.cos(a);e.dy=Math.sin(a)}
    if(e.t==='X')sp*=1+Math.sin(e.ph*1.7)*.18;
    if(e.t==='h'&&S==='play'){
      const tx=(drawing||true?px+.5:px),ty=py+.5;let want=Math.atan2(ty-e.y,tx-e.x),cur=Math.atan2(e.dy,e.dx),df=want-cur;
      while(df>Math.PI)df-=6.2832;while(df<-Math.PI)df+=6.2832;
      const mt=(drawing?1.5:.7)*dt;cur+=Math.max(-mt,Math.min(mt,df));e.dx=Math.cos(cur);e.dy=Math.sin(cur);
    }
    const dist=sp*dt,n=Math.max(1,Math.ceil(dist/.4)),st=dist/n;
    for(let k=0;k<n;k++){
      const nx=e.x+e.dx*st,ny=e.y+e.dy*st;
      const bx=solidAt(nx,e.y),by=solidAt(e.x,ny);
      let bounced=false;
      if(bx){e.dx=-e.dx;bounced=true}else e.x=nx;
      if(by){e.dy=-e.dy;bounced=true}else e.y=ny;
      if(!bx&&!by&&solidAt(nx,ny)){e.dx=-e.dx;e.dy=-e.dy;bounced=true}
      if(bounced){const a=Math.atan2(e.dy,e.dx)+(Math.random()-.5)*.14;e.dx=Math.cos(a);e.dy=Math.sin(a)}
      if(solidAt(e.x,e.y)){ // sıkıştıysa en yakın boş hücreye taşı
        let f=false;for(let r=1;r<6&&!f;r++)for(let j=-r;j<=r&&!f;j++)for(let i=-r;i<=r&&!f;i++)if(inb(e.x+i,e.y+j)&&g[idx((e.x+i)|0,(e.y+j)|0)]===0){e.x=((e.x+i)|0)+.5;e.y=((e.y+j)|0)+.5;f=true}
        if(!f){e.dead=true}
      }
    }
  }
}
function updateSparks(dt){
  for(const s of sparks){
    if(s.dead)continue;
    s.acc+=dt*s.sp;let guard=0;
    while(s.acc>=1&&guard++<4){
      s.acc-=1;
      if(!isB(s.x,s.y)){relocate(s);if(s.dead)break;continue}
      const l=[-s.dy,s.dx],r=[s.dy,-s.dx];
      const tu=Math.random()<.5?[l,r]:[r,l];
      const opts=[[s.dx,s.dy],tu[0],tu[1],[-s.dx,-s.dy]];
      let moved=false;
      for(const o of opts){if(isB(s.x+o[0],s.y+o[1])){s.x+=o[0];s.y+=o[1];s.dx=o[0];s.dy=o[1];moved=true;break}}
      if(!moved)relocate(s);
    }
  }
}
function relocate(s){
  for(let r=1;r<=14;r++)for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
    if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;
    if(isB(s.x+i,s.y+j)){s.x+=i;s.y+=j;return}
  }
  s.dead=true;
}

/* ============== çarpışmalar ============== */
function collisions(){
  if(invuln>0||grace>0)return;
  const pxx=px+.5,pyy=py+.5;
  for(const e of enemies){
    if(e.dead)continue;
    if(drawing&&Math.hypot(e.x-pxx,e.y-pyy)<e.r+.6){die();return}
    if(!trail.length)continue;
    const r=Math.ceil(e.r+1);
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){
      const a=(e.x|0)+i,b=(e.y|0)+j;
      if(inb(a,b)&&g[idx(a,b)]===2&&Math.hypot(a+.5-e.x,b+.5-e.y)<e.r+.55){die();return}
    }
  }
  for(const s of sparks){if(!s.dead&&Math.hypot(s.x-px,s.y-py)<1.05){die();return}}
}

function padHit(p){if(!touchy)return -1;for(let i=0;i<4;i++){if(Math.hypot(p[0]-padC()-PADB[i][0],p[1]-PADY-PADB[i][1])<=38)return i}return -1}

    x.fillStyle='#19e6ff';x.beginPath();
    const dx=b[2][0],dy=b[2][1];
    x.moveTo(bx+dx*11,by+dy*11);x.lineTo(bx-dy*10-dx*7,by+dx*10-dy*7);x.lineTo(bx+dy*10-dx*7,by-dx*10-dy*7);x.closePath();x.fill();
  }
}
function render(){
  if(bgDirty)drawBg();
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);x.drawImage(bgCv,0,0);
  x.setTransform(S0,0,0,S0,0,0);
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake*16;sy=(Math.random()-.5)*shake*16}
  x.save();x.translate(sx,sy);
  const h=hueOf(Math.max(1,lvl));
  // alan
  x.fillStyle='rgba(0,0,0,.45)';x.fillRect(FL,FT,C*CS,R*CS);
  x.strokeStyle='hsl('+h+',100%,60%)';x.lineWidth=2;glow('hsl('+h+',100%,55%)',10);x.strokeRect(FL-1,FT-1,C*CS+2,R*CS+2);x.shadowBlur=0;
  if(clDirty)drawClaimed();
  x.drawImage(clCv,0,0,clCv.width,clCv.height,FL,FT,C*CS,R*CS);
  if(flash){const a=Math.max(0,flash.t/.55);x.fillStyle='rgba(255,255,255,'+(a*.55)+')';for(const i of flash.cells)x.fillRect(FL+(i%C)*CS,FT+((i/C)|0)*CS,CS,CS)}
  // çizgi
  if(trail.length){
    x.beginPath();x.moveTo(cx2(startCell[0]+.5),cy2(startCell[1]+.5));
    for(const i of trail)x.lineTo(cx2((i%C)+.5),cy2(((i/C)|0)+.5));
    glow('#19e6ff',12);x.strokeStyle='#e8ffff';x.lineWidth=2.6;x.lineJoin='round';x.stroke();x.shadowBlur=0;
  }
  // düşmanlar
  for(const e of enemies)if(!e.dead)drawEnemy(e);
  for(const s of sparks)if(!s.dead){
    const a=cx2(s.x+.5),b=cy2(s.y+.5);glow('#fff',12);x.fillStyle='#fff';poly(4,3.6,gt*8,a,b);x.fill();glow('#19e6ff',14);x.fillStyle='rgba(25,230,255,.7)';x.beginPath();x.arc(a,b,5,0,7);x.fill();x.shadowBlur=0}
  // oyuncu
  if(S==='play'||S==='dying'||S==='pause'){
    if(S!=='dying'&&!(invuln>0&&((gt*14)|0)%2)){
      const a=cx2(px+.5),b=cy2(py+.5);
      glow('#19e6ff',16);x.fillStyle='#19e6ff';poly(4,6.4,Math.PI/4,a,b);x.fill();x.fillStyle='#fff';poly(4,3,Math.PI/4,a,b);x.fill();x.shadowBlur=0;
    }
  }
  // parçacıklar
  x.globalCompositeOperation='lighter';
  for(const p of parts){x.fillStyle=p.c;x.globalAlpha=Math.max(0,p.l*1.6);x.fillRect(p.x-1.5,p.y-1.5,3,3)}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.restore();
  if(S!=='menu'&&S!=='levels'&&S!=='scores'&&S!=='how'){
    drawHud();
    if(S==='play'&&hintT>0){x.globalAlpha=Math.min(1,hintT);txt(t('hint'),W/2,FT+R*CS+16,8,'#ffd23f','center');x.globalAlpha=1}
    if(S==='play'||S==='dying'||S==='pause')drawPad();
  }
}

/* ============== ana döngü ============== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;gt+=dt;
  if(S==='play'){
    grace=Math.max(0,grace-dt);invuln=Math.max(0,invuln-dt);hintT=Math.max(0,hintT-dt);
    playerUpdate(dt);
    if(S==='play'){updateEnemies(dt);updateSparks(dt);collisions();checkWin()}
  }else if(S==='dying'){dyingT+=dt;updateEnemies(dt*.25);if(dyingT>.9)afterDeath()}
  else if(S==='menu'||S==='clear'||S==='over'){updateEnemies(dt);updateSparks(dt)}
  if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
  if(shake>0)shake=Math.max(0,shake-dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
  render();requestAnimationFrame(frame);
}
resize();toMenu();requestAnimationFrame(frame);

})();
