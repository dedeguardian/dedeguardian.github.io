<title>NEON TOWER</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07001a}

html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace}
#w{position:relative;height:100%;max-width:100%;aspect-ratio:420/640}
canvas{width:100%;height:100%;display:block}
.b{position:absolute;bottom:14px;width:64px;height:64px;border-radius:50%;border:2px solid #0ff;color:#0ff;background:rgba(0,255,255,.08);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px #0ff8;opacity:.55}
.b:active{opacity:1;background:rgba(0,255,255,.3)}
#w:not(.play):not(.layout) .b{display:none}#w.layout #bp{display:none}#w.layout .b{opacity:.95;outline:2px dashed #ffd23f;outline-offset:3px;cursor:grab}#bp{top:10px;bottom:auto;left:50%;margin-left:-20px;width:40px;height:40px;font-size:15px;border-color:#ffd23f;color:#ffd23f;box-shadow:0 0 10px #ffd23f88;background:rgba(255,210,63,.08)}
#bl{left:12px}#br{left:86px}#bj{right:14px;width:84px;height:84px;border-color:#f0f;color:#f0f;box-shadow:0 0 12px #f0f8;background:rgba(255,0,255,.08)}

<div id="w"><canvas id="c" width="420" height="640"></canvas>
<div class="b" id="bl">◀</div><div class="b" id="br">▶</div><div class="b" id="bj">▲</div><div class="b" id="bp">❚❚</div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=420,H=640,WL=26;
let S='menu',P,plats,items,parts,camY,t,score,crys,fl,topN,topY,toast={s:'',t:0},best=0,ac;
let snd=true,sel=0,conf=0,hs=[],lastRank=-1,my0=300,mode='classic',lv=0,goal=0,prog=1,done=[],obs=[],lvSel=0,bonus=0,wallet=0,own=[0],selCh=0,cv=0,msgT=0,msgS='';
try{hs=JSON.parse(localStorage.getItem('nt_hs')||'[]');snd=localStorage.getItem('nt_snd')!=='0'}catch(e){}
try{wallet=+localStorage.getItem('nt_w')||0;own=JSON.parse(localStorage.getItem('nt_own')||'[0]');selCh=+localStorage.getItem('nt_ch')||0;if(!own.includes(selCh))selCh=0;const o=JSON.parse(localStorage.getItem('nt_lv')||'{}');prog=o.p||1;done=o.d||[]}catch(e){}
let dn=[];try{dn=JSON.parse(localStorage.getItem('nt_dn')||'[]')}catch(e){}
const K={l:0,r:0,j:0};
const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H*.65,s:Math.random()*1.6+.4}));
const TY={jet:{c:'#ff9d00',l:'J',n:'JETPACK!'},dj:{c:'#39ff14',l:'2',n:'ÇİFT ZIPLAMA!'},mag:{c:'#ff2bd6',l:'M',n:'MIKNATIS!'}};

function beep(f,d,ty,v){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

function reset(){
 P={x:W/2-11,y:-28,vx:0,vy:0,w:22,h:28,g:true,jet:0,dj:0,mag:0,used:false,jetting:false,face:1};
 plats=[{x:WL,y:0,w:W-2*WL,n:0}];obs=[];buildMap();items=[];parts=[];camY=-H+90;t=0;score=0;crys=0;fl=0;topN=0;topY=0;
 while(topY>camY-120)gen();
  P.offer=200;
 if(CH[selCh].pk==='nova')startCarry();
}
function gen(){
 topN++;const n=topN,y=-n*88;topY=y;
 if(mode==='level'&&n===goal){plats.push({x:WL,y,w:W-2*WL,n,goal:1});return}
 if(n%10===0){plats.push({x:WL,y,w:W-2*WL,n});return}
 const w=Math.max(64,140-n*.7)+Math.random()*30,px=WL+Math.random()*(W-2*WL-w);
 const p={x:px,y,w,n};
 if(mode==='level'&&n>2){const D=DF(),q=Math.random();if(q<D.mv)p.mv=(Math.random()<.5?-1:1)*(.8+lv*.12);else if(Math.random()<D.cr)p.cr=1}
 plats.push(p);
 const r=(p.mv||p.cr)?9:Math.random(),cx=px+w/2;
 if(r<.5)items.push({x:cx,y:y-26,k:'cr'});
 else if(r<(mode==='level'?.53:.58)){const ks=['jet','mag'];items.push({x:cx,y:y-28,k:ks[Math.random()*2|0]})}
 if(n>2&&!p.mv&&!p.cr&&Math.random()<(mode==='level'?.04:.14))items.push({x:px+16+Math.random()*(w-32),y:y-8,k:'sp',a:0});
 if(mode==='level'&&n>2&&n<goal){const D=DF(),m=y+44;
  if(Math.random()<D.dr)obs.push({k:'dr',x:WL+20+Math.random()*(W-2*WL-40),y:m,vx:(Math.random()<.5?-1:1)*(1.2+lv*.15),ph:Math.random()*6});
  else if(Math.random()<D.ls)obs.push({k:'ls',y:m,ph:Math.random()*200|0})}
}
function burst(px,py,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:25+Math.random()*15,c:col})}
function jump(){
 if(S!=='play')return;
 if(P.g){P.offer=0;P.vy=-11.5-Math.abs(P.vx)*.4;P.g=false;beep(380+Math.abs(P.vx)*20,.12,'square')}
 
}
function start(){mode='classic';hard=0;reset();S='play';beep(520,.2,'sawtooth')}

function upd(){
 t++;
 for(const p of plats){if(p.mv){p.x+=p.mv;if(p.x<WL||p.x+p.w>W-WL){p.mv*=-1;p.x=Math.max(WL,Math.min(p.x,W-WL-p.w))}}
  if(p.crt>0&&!p.fall&&--p.crt===0){p.fall=1;p.fv=0}if(p.fall){p.fv+=.4;p.y+=p.fv}}
 if(P.g&&P.on&&P.on.mv)P.x+=P.on.mv;
 if(P.carry){P.jet=Math.max(P.jet,2);P.imm=Math.max(P.imm||0,3);fl=Math.max(fl,Math.min(P.carryN,Math.floor(-P.y/88)));if(P.y<=P.carryY){P.carry=0;P.jet=0;P.imm=120}}
 if(K.l){P.vx-=.6;P.face=-1}if(K.r){P.vx+=.6;P.face=1}
 P.vx*=P.g?.8:.94;const vm=CH[selCh].pk==='fast'?5.8:5.2;P.vx=Math.max(-vm,Math.min(vm,P.vx));
 P.x+=P.vx;
 if(P.x<WL){P.x=WL;P.vx=Math.abs(P.vx)*.5;beep(180,.06,'triangle')}
 if(P.x+P.w>W-WL){P.x=W-WL-P.w;P.vx=-Math.abs(P.vx)*.5;beep(180,.06,'triangle')}
 if(P.jet>0){P.vy=Math.max(P.vy-1.1,-7);P.jet--;
  parts.push({x:P.x+11+(Math.random()-.5)*8,y:P.y+30,vx:(Math.random()-.5)*1.5,vy:2+Math.random()*2,l:18,c:Math.random()<.5?'#ff9d00':'#ff2bd6'})}
 else P.vy=Math.min(P.vy+.5,14);
 const prev=P.y+P.h;P.y+=P.vy;P.g=false;
 if(P.vy>=0)for(const p of plats){
  if(!p.fall&&P.x+P.w>p.x&&P.x<p.x+p.w&&prev<=p.y+1&&P.y+P.h>=p.y){
   P.y=p.y-P.h;P.vy=0;P.g=true;P.used=false;P.on=p;if(p.cr&&!p.crt&&!NC())p.crt=CH[selCh].pk==='luna'?75:45;
   if(p.n>fl){fl=p.n;if(fl%10===0){toast={s:'KAT '+fl+' // HIZLANIYOR',t:90};beep(880,.25,'sawtooth')}}
  }}
 if(mode==='level'&&fl>=goal&&P.g){winLevel();return}
 if(P.imm>0)P.imm--;if(P.offer>0)P.offer--;if(P.dj>0)P.dj--;if(P.mag>0)P.mag--;if(CH[selCh].pk==='zero')P.mag=600;
 const px=P.x+11,py=P.y+14;
 for(const it of items){if(it.d)continue;
  if(it.k==='sp'){if(P.vy>=0&&Math.abs(P.x+11-it.x)<18&&P.y+P.h>it.y-8&&P.y+P.h<it.y+12){P.vy=CH[selCh].pk==='yuki'?-20:-17.5;P.imm=70;if(mode==='level')toast={s:'KALKAN AKTİF!',t:60};P.g=false;it.a=8;burst(it.x,it.y,'#ffd23f',16);beep(300,.2,'sine',.07);beep(900,.15,'triangle',.05)}continue}
  if((P.mag>0||CH[selCh].pk==='mika')&&it.k==='cr'){const dx=px-it.x,dy=py-it.y,d=Math.hypot(dx,dy);if(d<(P.mag>0?160:75)){it.x+=dx/d*6;it.y+=dy/d*6}}
  if(Math.hypot(px-it.x,py-it.y)<22){it.d=1;
   if(it.k==='cr'){crys++;wallet++;if(CH[selCh].pk==='yuki'&&Math.random()<.2)wallet++;sv();burst(it.x,it.y,'#0ff',8);beep(1000+Math.min(crys,30)*15,.08,'square')}
   else{if(it.k==='jet')P.jet=CH[selCh].pk==='jet'?120:CH[selCh].pk==='vega'?135:90,P.imm=150;if(it.k==='dj')P.dj=720;if(it.k==='mag')P.mag=CH[selCh].pk==='mag'?900:600;toast={s:TY[it.k].n,t:80};burst(it.x,it.y,TY[it.k].c,20);beep(1200,.25,'triangle',.06)}}}

 if(mode==='level'){const px2=P.x+11,py2=P.y+14;
  if(lv>=5&&t%Math.max(45,170-(lv-5)*22)===0)obs.push({k:'db',x:WL+10+Math.random()*(W-2*WL-20),y:camY-20,vy:3+lv*.3});
  for(const o of obs){let h=0;
   if(o.k==='dr'){o.x+=o.vx;if(o.x<WL+10||o.x>W-WL-10)o.vx*=-1;o.yy=o.y+Math.sin(t*.05+o.ph)*10;h=Math.hypot(px2-o.x,py2-o.yy)<16}
   else if(o.k==='db'){o.y+=o.vy;h=Math.hypot(px2-o.x,py2-o.y)<15}
   else h=((t+o.ph)%200)<70&&Math.abs(py2-o.y)<12&&!(P.jet>0||P.imm>0||CH[selCh].pk==='nova');
   if(h&&!(P.jet>0||P.imm>0)){burst(px2,py2,'#ff3b5c',30);die();return}}
  obs=obs.filter(o=>o.y<camY+H+100)}
 const spd=sp();
 camY-=spd;if(P.y<camY+H*.4)camY=P.y-H*.4;
 while(topY>camY-120)gen();
 plats=plats.filter(p=>p.y<camY+H+100);items=items.filter(i=>!i.d&&i.y<camY+H+100);
 for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.l--}parts=parts.filter(q=>q.l>0);
 if(toast.t>0)toast.t--;
 score=fl*10+crys*50;
 if(P.y>camY+H+30){die()}
}

function glow(col,b){x.shadowColor=col;x.shadowBlur=b}
function txt(s,px,py,sz,col,al,mw){x.font='bold '+sz+'px "Courier New",monospace';x.textAlign=al||'center';x.fillStyle=col;x.fillText(tr(s),px,py,mw||380)}

function draw(){
 bg();walls();
 for(const p of plats){const y=p.y-camY;if(y<-20||y>H+20)continue;
  plat(p,y)}
 for(const it of items){const y=it.y-camY+Math.sin(t*.08+it.x)*3;if(y<-20||y>H+20)continue;
  if(it.k==='cr'){glow('#0ff',14);const w=2+6*Math.abs(Math.cos(t*.07+it.x));x.fillStyle='rgba(25,230,255,.55)';x.beginPath();x.moveTo(it.x,y-10);x.lineTo(it.x+w,y);x.lineTo(it.x,y+10);x.lineTo(it.x-w,y);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke()}
  else if(it.k==='sp'){const yy=it.y-camY,hh=10-(it.a>0?(it.a--,5):0);glow('#ffd23f',12);x.fillStyle='#ffd23f';x.strokeStyle='#ffd23f';x.lineWidth=2;x.fillRect(it.x-14,yy+5,28,3);x.beginPath();x.moveTo(it.x-8,yy+5);x.lineTo(it.x+8,yy+5-hh/3);x.lineTo(it.x-8,yy+5-hh*2/3);x.lineTo(it.x,yy+5-hh);x.stroke();x.fillStyle='#ff2bd6';x.fillRect(it.x-16,yy+2-hh,32,3)}
  else{const T=TY[it.k];glow(T.c,16);x.strokeStyle=T.c;x.lineWidth=2;x.beginPath();x.arc(it.x,y,12,0,7);x.stroke();txt(T.l,it.x,y+5,14,T.c)}
  x.shadowBlur=0}
 drawObs();
 for(const q of parts){x.globalAlpha=Math.min(1,q.l/15);x.fillStyle=q.c;glow(q.c,8);x.fillRect(q.x-2,q.y-camY-2,4,4)}x.globalAlpha=1;x.shadowBlur=0;
 if(S==='play'||S==='pause'||S==='over'||S==='win'||S==='revive'){
  const px=P.x,py=P.y-camY;
  if(P.mag>0){x.strokeStyle='#ff2bd6';x.globalAlpha=.3;x.lineWidth=1;x.beginPath();x.arc(px+11,py+14,160,0,7);x.stroke();x.globalAlpha=1}
  if(mode==='level'&&(P.jet>0||P.imm>0)){x.globalAlpha=.5+.3*Math.sin(t*.4);x.strokeStyle='#19e6ff';glow('#19e6ff',14);x.lineWidth=2;x.beginPath();x.arc(px+11,py+14,22,0,7);x.stroke();x.shadowBlur=0;x.globalAlpha=1}
  robot(px,py)}
 if(S==='play'||S==='pause'||S==='revive')hud();
}
function hud(){
 glow('#0ff',8);txt('SKOR '+score,WL+8,26,16,'#0ff','left');txt(mode==='level'&&!hard?'KAT '+fl+'/'+goal:'KAT '+fl,W-WL-8,26,16,'#ff2bd6','right');x.shadowBlur=0;
 txt('◆ '+crys,WL+8,46,12,'#cfe','left');{const bt=(hard?hh:hs)[0];if((mode==='classic'||hard)&&score>0&&(!bt||score>bt.s))txt('★ YENİ YÜKSEK SKOR! ★',WL+8,80,10,'#ffd23f','left',200)}
 if(mode==='level')txt(hard?'ZOR MOD':'SEVİYE '+(lv+1)+' · '+TH[lv].n,WL+8,62,10,'#9bd','left');
 const spd=sp();txt('HIZ',W-WL-70,46,10,'#cfe','right');
 x.strokeStyle='#ff2bd6';x.strokeRect(W-WL-66,38,58,8);x.fillStyle='#ff2bd6';x.fillRect(W-WL-66,38,58*spd/2.6,8);
 let by=H-18;const bar=(l,v,col)=>{if(v<=0)return;x.fillStyle=col;x.font='10px monospace';x.textAlign='left';x.fillText(l,WL+8,by+8);x.strokeStyle=col;x.strokeRect(WL+30,by,60,8);x.fillRect(WL+30,by,60*v,8);by-=14};
 bar('JET',Math.min(1,P.jet/90),'#ff9d00');bar('2x',P.dj/720,'#39ff14');bar('MIK',Math.min(1,P.mag/600),'#ff2bd6');
 if(P.offer>0){const a=P.offer/200;glow('#ffd23f',16);x.strokeStyle='#ffd23f';x.lineWidth=3;x.beginPath();x.arc(W/2,130,26,-Math.PI/2,-Math.PI/2+6.283*a);x.stroke();x.shadowBlur=0;x.fillStyle='rgba(255,210,63,.12)';x.beginPath();x.arc(W/2,130,26,0,7);x.fill();txt('J',W/2,140,28,'#ffd23f');txt('ÖZEL J!',W/2,176,12,'#ffd23f');txt('DOKUN VEYA J TUŞU',W/2,192,10,'#cfe');if(CH[selCh].pk!=='nova')txt('300 ◆',W/2,210,12,wallet>=300?'#0ff':'#ff3b5c')}
 if(toast.t>0){x.globalAlpha=Math.min(1,toast.t/25);glow('#ffe14d',14);txt(toast.s,W/2,120,22,'#ffe14d');x.shadowBlur=0;x.globalAlpha=1}
}


let bl;function buildBl(c1,w1,c2,w2){bl=[[.05,c1,w1,.4],[.14,c2,w2,.6]].map(([k,c,w,a],L)=>{const arr=[];let px=-10;while(px<W){const bw=30+Math.random()*50;arr.push({x:px,w:bw,h:140+Math.random()*(L?260:200)});px+=bw+2}return{k,c,w,a,arr}})}
const rain=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*6}));
function bg(){
 const h0=HB(),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03000f');g.addColorStop(.6,'hsl('+h0+',70%,14%)');g.addColorStop(1,'#2a0840');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#fff';for(const s of stars){x.globalAlpha=.3+.4*Math.sin(t*.03+s.x);x.fillRect(s.x,(s.y+(-camY)*.03)%(H*.6),s.s,s.s)}x.globalAlpha=1;
 const py=150+(-camY)*.02,pg=x.createRadialGradient(295,py-15,5,310,py,56);pg.addColorStop(0,mode==='level'?'hsl('+(h0+30)+',100%,72%)':'#ff8ae2');pg.addColorStop(1,mode==='level'?'hsl('+h0+',70%,20%)':'#3a0a6a');
 x.fillStyle=pg;x.beginPath();x.arc(310,py,56,0,7);x.fill();x.strokeStyle='#19e6ff';x.lineWidth=2;glow('#19e6ff',10);x.beginPath();x.ellipse(310,py,98,20,-.4,0,7);x.stroke();x.shadowBlur=0;
 for(const L of bl){const yb=H+(-camY)*L.k-10;x.fillStyle=L.c;L.arr.forEach((b,i)=>{if(yb-b.h>H)return;x.fillRect(b.x,yb-b.h,b.w,b.h+400)});
  x.fillStyle=L.w;x.globalAlpha=L.a;x.beginPath();L.arr.forEach((b,i)=>{for(let r=0,yy=yb-b.h+8;yy<H;yy+=12,r++){if(yy<-10)continue;for(let xx=b.x+4,q=0;xx<b.x+b.w-5;xx+=9,q++)if((i*7+r*13+q*5)%9<3)x.rect(xx,yy,4,6)}});x.fill();x.globalAlpha=1}
 const sy=H*.45+(-camY)*.14;if((t%120)>6){glow('#19e6ff',16);txt('ネオン',66,sy,22,'#19e6ff')}x.shadowBlur=0;
 x.strokeStyle='rgba(150,220,255,.25)';x.lineWidth=1;x.beginPath();for(const r of rain){r.y+=r.s;r.x-=1;if(r.y>H){r.y=-10;r.x=Math.random()*W}x.moveTo(r.x,r.y);x.lineTo(r.x-1.5,r.y+9)}x.stroke();
}
function walls(){
 const hu=mode==='level'?(TH[lv].h+20)%360:(300+fl*3)%360,col='hsl('+hu+',100%,60%)';
 x.fillStyle='#0a0320';x.fillRect(0,0,WL,H);x.fillRect(W-WL,0,WL,H);
 const o=((-camY)%18+18)%18;
 for(let yy=-18+o;yy<H;yy+=18){const id=Math.round((yy+camY)/18);
  for(let q=0;q<2;q++){if((id*7+q*3)%5<2){x.fillStyle=(id+q)%3?'#ffd23f':'#19e6ff';x.globalAlpha=.7;x.fillRect(5+q*10,yy,6,8);x.fillRect(W-WL+5+q*10,yy,6,8)}}}
 x.globalAlpha=.75+.25*Math.sin(t*.1);x.strokeStyle=col;x.lineWidth=3;glow(col,14);x.beginPath();x.moveTo(WL,0);x.lineTo(WL,H);x.moveTo(W-WL,0);x.lineTo(W-WL,H);x.stroke();x.globalAlpha=1;x.shadowBlur=0;
}
function plat(p,y){if(p.crt>0&&!p.fall)y+=Math.random()*2-1;const big=p.n%10===0||p.goal,col=p.goal?'#39ff14':p.cr?'#ff7a00':big?'#ffd23f':'hsl('+((PB()+p.n*9)%360)+',100%,60%)';
 x.lineCap='round';glow(col,16);x.strokeStyle=col;x.lineWidth=6;x.beginPath();x.moveTo(p.x+6,y+5);x.lineTo(p.x+p.w-6,y+5);x.stroke();
 x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.lineCap='butt';
 x.fillStyle='#2a1a55';x.fillRect(p.x,y,4,12);x.fillRect(p.x+p.w-4,y,4,12);x.fillRect(p.x+p.w/2-2,y+8,4,6);
 if(p.mv){x.fillStyle=col;x.fillRect(p.x+8,y+1,3,8);x.fillRect(p.x+p.w-11,y+1,3,8)}

 if(S==='play'){if(k==='j'||k==='J'){takeJ();return}if(kd[k]){K[kd[k]]=1;e.preventDefault()}
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(!K.j)jump();K.j=1}return}
 if(S==='levels'){const d={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1,ArrowUp:-5,w:-5,W:-5,ArrowDown:5,s:5,S:5}[k];
  if(d)lvSel=Math.max(0,Math.min(9,lvSel+d));else if((k==='Enter'||k===' ')&&!e.repeat){if(lvSel<prog)startLevel(lvSel)}e.preventDefault();return}
 if(S==='lang'){const d={ArrowLeft:-1,a:-1,A:-1,ArrowRight:1,d:1,D:1,ArrowUp:-2,w:-2,W:-2,ArrowDown:2,s:2,S:2}[k];if(d)lsel=Math.max(0,Math.min(LG.length-1,lsel+d));else if((k==='Enter'||k===' ')&&!e.repeat)pickLang(lsel);e.preventDefault();return}
 if(S==='chars'&&(k==='ArrowLeft'||k==='a'||k==='A')){cv=(cv+CH.length-1)%CH.length;e.preventDefault();return}
 if(S==='chars'&&(k==='ArrowRight'||k==='d'||k==='D')){cv=(cv+1)%CH.length;e.preventDefault();return}
 const it=items_(),n=it.length;if(!n)return;
 if(k==='ArrowUp'||k==='w'||k==='W')sel=(sel+n-1)%n;
 else if(k==='ArrowDown'||k==='s'||k==='S')sel=(sel+1)%n;
 else if((k==='Enter'||k===' ')&&!e.repeat)it[sel][1]();
 e.preventDefault()});

function bind(id,f){const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();f(1)});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,e=>f(0)))}
bind('bl',v=>K.l=v);bind('br',v=>K.r=v);

 while(acc>=1000/60){if(S==='play')upd();else t++;acc-=1000/60}
